<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Self review</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header id="top"><span class="muted">Loading review…</span></header>
    <div id="banner" role="region" aria-label="Guideline learning" hidden></div>
    <div id="layout">
        <nav id="side" aria-label="Review navigation"></nav>
        <main id="main" tabindex="-1"></main>
        <div id="ruler" aria-hidden="true"></div>
    </div>
    <div id="dialog"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="app.js"></script>
</body>
</html>
